<!-- LOGIC & CLICK TRACKING SCRIPT -->
    <script>
        let recipientCompany = "Er Verksamhet";
        let recipientRole = "Utlyst Befattning";
        let recipientKeywords = "Ledarskap, Projektstyrning, Drift";

        const tabData = {
            leadership: {
                title: "VD & Övergripande Verksamhetsansvar",
                badge: "Strategiskt & Ekonomiskt Ansvar",
                text: "Erfarenhet från VD-roll med helhetsansvar för resultat, personal och långsiktig tillväxt. Van att navigera i komplexa miljöer, fatta beslut under ansvar och säkerställa att verksamhetens mål nås med hög kvalitet."
            },
            operations: {
                title: "Platschef & Operativ Lagbas",
                badge: "Närvarande Ledarskap på Fältet",
                text: "Mångårig bakgrund i direkt ledarskap ute i driften. Expertis inom resursplanering, arbetsmiljö, logistik och att skapa en stark laganda där alla drar åt samma håll för att hålla tidsramar."
            },
            projects: {
                title: "Projektstyrning & Processoptimering",
                badge: "Struktur & Leveranssäkerhet",
                text: "Drivit och strukturerat projekt från uppstart till överlämning. Starkt fokus på ordning, dokumentation och att eliminera flaskhalsar genom smarta rutin- och digitaliseringssteg."
            },
            business: {
                title: "Eget Företagande & Entreprenörskap",
                badge: "Affärsmässighet & Handlingskraft",
                text: "Byggt och drivit egna verksamheter vilket gett en djup förståelse för hela affärskedjan – från kundkontakt och försäljning till ekonomisk uppföljning och praktiskt genomförande."
            }
        };

        window.onload = function() {
            try {
                parseURLParams();
            } catch (e) {
                console.log("URL-parsning fel:", e);
            }

            try {
                updateDOMValues();
            } catch (e) {
                console.log("DOM-uppdatering fel:", e);
            }

            try {
                renderMatchTable();
            } catch (e) {
                console.log("Match-tabell fel:", e);
            }

            try {
                switchTab('leadership');
            } catch (e) {
                console.log("Flik-laddning fel:", e);
            }

            try {
                setupLinkGenerator();
            } catch (e) {
                console.log("Länkgenerator fel:", e);
            }
        };

        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('foretag') && params.get('foretag').trim() !== "") {
                recipientCompany = decodeURIComponent(params.get('foretag').trim());
            }
            if (params.has('roll') && params.get('roll').trim() !== "") {
                recipientRole = decodeURIComponent(params.get('roll').trim());
            }
            if (params.has('nyckelord') && params.get('nyckelord').trim() !== "") {
                recipientKeywords = decodeURIComponent(params.get('nyckelord').trim());
            }

            const stad = params.get('stad') ? decodeURIComponent(params.get('stad')) : "";

            // Skicka klick-signal tyst i bakgrunden
            if (params.has('foretag') || params.has('roll')) {
                const scriptURL = "https://script.google.com/macros/s/AKfycbzqacxAAXyNQbSzhiV0pr-voXCnYlRpJj-s51IZlhnQ67wUjz2AXXZyrjwPjcK5y2rEHQ/exec";

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        foretag: recipientCompany,
                        roll: recipientRole,
                        nyckelord: recipientKeywords,
                        stad: stad
                    })
                }).catch(err => console.log("Spårning misslyckades:", err));
            }
        }

        function updateDOMValues() {
            const elHeader = document.getElementById('header-company-name');
            const elHeroComp = document.getElementById('hero-company-name');
            const elHeroRole = document.getElementById('hero-role-title');
            const elHeroKw = document.getElementById('hero-keywords-badge');

            if (elHeader) elHeader.textContent = recipientCompany;
            if (elHeroComp) elHeroComp.textContent = recipientCompany;
            if (elHeroRole) elHeroRole.textContent = recipientRole;
            if (elHeroKw) elHeroKw.textContent = recipientKeywords;
        }

        function renderMatchTable() {
            const tableBody = document.getElementById('match-table-body');
            if (!tableBody) return;

            const keywordsArray = recipientKeywords.split(',').map(k => k.trim());
            let rowsHTML = '';

            rowsHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-semibold text-slate-900">Rollmatchning: ${recipientRole}</td>
                    <td class="p-4">25+ års samlad erfarenhet som VD, platschef, lagbas och projektledare inom offentlig och privat sektor.</td>
                    <td class="p-4 text-center"><span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full">Verifierad</span></td>
                </tr>
            `;

            keywordsArray.forEach((kw) => {
                if(kw) {
                    rowsHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-4 font-semibold text-slate-900">${kw}</td>
                            <td class="p-4">Dokumenterad praktisk tillämpning och resultatstyrning från tidigare ledaruppdrag och eget företagande.</td>
                            <td class="p-4 text-center"><span class="px-2.5 py-1 bg-indigo-100 text-indigo-800 text-xs font-semibold rounded-full">Hög Match</span></td>
                        </tr>
                    `;
                }
            });

            rowsHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-semibold text-slate-900">Långsiktigt Engagemang</td>
                    <td class="p-4">Full tillgänglighet för heltidsuppdrag med start enligt ö.k.</td>
                    <td class="p-4 text-center"><span class="px-2.5 py-1 bg-slate-100 text-slate-800 text-xs font-semibold rounded-full">Klar för start</span></td>
                </tr>
            `;

            tableBody.innerHTML = rowsHTML;
        }

        function switchTab(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-btn-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('active');

            const data = tabData[tabKey];
            const container = document.getElementById('tab-content-container');
            if (!container || !data) return;

            container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h4 class="text-lg font-bold text-slate-900">${data.title}</h4>
                        <span class="text-xs font-medium px-2.5 py-1 bg-slate-100 text-slate-700 rounded border border-slate-200">${data.badge}</span>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed">${data.text}</p>
                </div>
            `;
        }

        function setupLinkGenerator() {
            const compInput = document.getElementById('gen-company');
            const roleInput = document.getElementById('gen-role');
            const kwInput = document.getElementById('gen-keywords');

            if (compInput) compInput.value = recipientCompany !== 'Er Verksamhet' ? recipientCompany : '';
            if (roleInput) roleInput.value = recipientRole !== 'Utlyst Befattning' ? recipientRole : '';
            if (kwInput) kwInput.value = recipientKeywords !== 'Ledarskap, Projektstyrning, Drift' ? recipientKeywords : '';

            ['gen-company', 'gen-role', 'gen-keywords'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', generateURL);
                }
            });

            generateURL();
        }

        function generateURL() {
            const compEl = document.getElementById('gen-company');
            const roleEl = document.getElementById('gen-role');
            const kwEl = document.getElementById('gen-keywords');
            const resultEl = document.getElementById('gen-result-url');

            if (!resultEl) return;

            const comp = encodeURIComponent(compEl ? compEl.value.trim() || 'Företag' : 'Företag');
            const role = encodeURIComponent(roleEl ? roleEl.value.trim() || 'Tjänst' : 'Tjänst');
            const kw = encodeURIComponent(kwEl ? kwEl.value.trim() || 'Ledarskap, Drift' : 'Ledarskap, Drift');

            const baseUrl = window.location.origin + window.location.pathname;
            resultEl.value = `${baseUrl}?foretag=${comp}&roll=${role}&nyckelord=${kw}`;
        }

        function copyGeneratedUrl() {
            const input = document.getElementById('gen-result-url');
            if (!input) return;
            input.select();
            input.setSelectionRange(0, 99999); // För mobila enheter
            navigator.clipboard.writeText(input.value).then(() => {
                alert('Den skräddarsydda URL-länken har kopierats till urklipp!');
            }).catch(() => {
                document.execCommand('copy');
                alert('Den skräddarsydda URL-länken har kopierats till urklipp!');
            });
        }
    </script>
